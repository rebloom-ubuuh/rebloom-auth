
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>REBLOOM — Threads</title>
</head>
<body>
  <h2>REBLOOM — авторизация Threads</h2>
  <p id="status">Проверяем авторизацию...</p>
  <button id="copy" type="button" hidden>
    Скопировать код авторизации
  </button>

  <script>
    const params = new URLSearchParams(location.search);
    const status = document.getElementById("status");
    const button = document.getElementById("copy");
    const code = params.get("code");

    if (code) {
      status.textContent =
        "Threads подтвердил доступ. Скопируйте код кнопкой ниже.";
      button.hidden = false;

      button.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(code);
          status.textContent =
            "Код скопирован. Сохраните его в приватном GitHub.";
        } catch {
          status.textContent =
            "Не удалось скопировать код. Повторите попытку.";
        }
      });

      history.replaceState({}, "", location.pathname);
    } else if (params.has("error")) {
      status.textContent =
        "Авторизация не удалась. Попробуйте ещё раз.";
      history.replaceState({}, "", location.pathname);
    } else {
      status.textContent =
        "Страница авторизации REBLOOM готова.";
    }
  </script>
</body>
</html>
